    <!-- Mobile PWA Meta Tags & Manifest -->
    <meta name="theme-color" content="#0d0d0d" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />

    <meta name="apple-mobile-web-app-title" content="OWL VISION PRO" />

    <!-- Favicon and App Icons -->
    <link rel="icon" type="image/jpeg" href="/owl_vision_logo.jpg" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/owl_vision_logo.jpg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/owl_vision_logo.jpg" />
    <link rel="apple-touch-startup-image" href="/owl_vision_logo.jpg" />
    
    <!-- Early PWA Registration & beforeinstallprompt Interceptor -->
    <script>
      window.deferredPrompt = null;
      window.addEventListener('beforeinstallprompt', function (e) {
        e.preventDefault();
        window.deferredPrompt = e;
        window.dispatchEvent(new CustomEvent('pwa-prompt-ready'));
      });

      // Avoid running ServiceWorker inside developer iframe to prevent proxy MIME issues
      var isInIframe = false;
      try {
        isInIframe = window.self !== window.top;
      } catch (err) {
        isInIframe = true;
      }

      if ('serviceWorker' in navigator) {
        if (isInIframe) {
          // Inside preview iframe: cleanly unregister any stale workers
          navigator.serviceWorker.getRegistrations().then(function (registrations) {
            for (var i = 0; i < registrations.length; i++) {
              registrations[i].unregister();
            }
          }).catch(function () {});
        } else {
          // Top-level standalone / native browser: register safely on load
          window.addEventListener('load', function () {
            navigator.serviceWorker.register('/sw.js', { scope: '/' })
              .then(function (reg) {
                reg.addEventListener('updatefound', function () {
                  var newWorker = reg.installing;
                  if (newWorker) {
                    newWorker.addEventListener('statechange', function () {
                      if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                        window.dispatchEvent(new CustomEvent('pwa-update-available'));
                      }
                    });
                  }
                });
              })
              .catch(function (err) {
                // Silently handle if offline or unsupported
              });
          });
        }
      }
    </script>
  </head>
  <body class="bg-black text-white antialiased overflow-x-hidden selection:bg-[#D4AF37] selection:text-black">

  </body>
