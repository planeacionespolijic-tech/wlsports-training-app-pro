<!doctype html>
<html lang="es" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>WLSPORTS</title>
    <meta name="description" content="Plataforma profesional de entrenamiento personalizado con inteligencia deportiva, gamificación y monitoreo en tiempo real." />
    <meta property="og:title" content="WLSPORTS" />
    <meta property="og:description" content="Plataforma profesional de entrenamiento personalizado con inteligencia deportiva, gamificación y monitoreo en tiempo real." />
    
    <!-- Mobile PWA Meta Tags & Manifest -->
    <meta name="theme-color" content="#0d0d0d" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="WLSPORTS" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="manifest" href="/manifest.json" />
    
    <!-- Favicon and App Icons -->
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="apple-touch-startup-image" href="/apple-touch-icon.png" />
    
    <!-- Early PWA Registration & beforeinstallprompt Interceptor -->
    <script>
      window.deferredPrompt = null;
      window.addEventListener('beforeinstallprompt', function (e) {
        e.preventDefault();
        window.deferredPrompt = e;
        window.dispatchEvent(new CustomEvent('pwa-prompt-ready'));
        console.log('[PWA] beforeinstallprompt captured early');
      });

      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('/sw.js', { scope: '/' })
          .then(function (reg) {
            reg.update();
            console.log('[PWA] ServiceWorker registered with scope:', reg.scope);
            
            // Auto check on app focus/visibility
            document.addEventListener('visibilitychange', function() {
              if (document.visibilityState === 'visible') {
                reg.update();
              }
            });

            reg.addEventListener('updatefound', function () {
              var newWorker = reg.installing;
              if (newWorker) {
                newWorker.addEventListener('statechange', function () {
                  if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                    console.log('[PWA] New version ready - triggering update event');
                    window.dispatchEvent(new CustomEvent('pwa-update-available'));
                  }
                });
              }
            });
          })
          .catch(function (err) {
            console.warn('[PWA] ServiceWorker register failed:', err);
          });

        var refreshing = false;
        navigator.serviceWorker.addEventListener('controllerchange', function () {
          if (!refreshing) {
            refreshing = true;
            window.location.reload();
          }
        });
      }
    </script>
  </head>
  <body class="bg-black text-white antialiased overflow-x-hidden selection:bg-[#D4AF37] selection:text-black">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
